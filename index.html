<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MM2 Supreme Trade Calculator</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0b0d12;color:#fff}.wrap{max-width:760px;margin:auto;padding:16px}h1{font-size:22px}.card{background:#121620;border:1px solid #252b38;border-radius:16px;padding:14px;margin:12px 0}input,button{font:inherit}input{width:100%;padding:12px;border-radius:12px;background:#0b0d12;color:#fff;border:1px solid #303746}button{padding:10px 12px;border:0;border-radius:11px;background:#252c39;color:#fff;font-weight:700}.row{display:flex;gap:8px}.row>*{flex:1}.item,.offerline{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid #252b38}.meta,.small{font-size:11px;color:#9ca3af}.total{font-size:20px;font-weight:800;margin-top:8px}.wfl{text-align:center;font-size:25px;font-weight:900;padding:14px;border-radius:14px;background:#25252a}.good{background:#12301f}.bad{background:#32161b}.actions{display:flex;gap:8px;margin-top:10px}.actions>*{flex:1}</style></head><body><div class="wrap"><h1>MM2 Supreme Trade Calculator</h1><div class="small" id="status">Loading…</div><div class="card"><div class="row"><button id="side">Adding to: YOU</button><button id="refresh">Refresh Values</button></div><br><input id="search" placeholder="Search item…"><div id="results"></div></div><div class="card"><b>Your Offer</b><div id="you"></div><div class="total" id="yt">Total: 0</div></div><div class="card"><b>Their Offer</b><div id="them"></div><div class="total" id="tt">Total: 0</div></div><div class="card"><div id="result" class="wfl">Add items</div><div class="small" id="details"></div><div class="actions"><button id="clear">Clear</button><button id="copy">Copy</button></div></div></div><script>
const U="./data/values.json",C="mm2supreme";let db={items:[]},side="you",o={you:[],them:[]};const $=x=>document.getElementById(x),num=x=>Number(x||0).toLocaleString();
async function load(force=false){$("status").textContent="Updating…";try{let r=await fetch(U+(force?"?t="+Date.now():""),{cache:"no-store"});if(!r.ok)throw 0;db=await r.json();localStorage.setItem(C,JSON.stringify(db));$("status").textContent=(db.item_count||db.items.length)+" items • "+new Date(db.updated_at).toLocaleString()}catch(e){let x=localStorage.getItem(C);if(x){db=JSON.parse(x);$("status").textContent="Offline cache"}else $("status").textContent="Unable to load values"}renderResults();render()}
function renderResults(){let q=$("search").value.toLowerCase().trim();if(!q){$("results").innerHTML='<div class="small">Search for an item.</div>';return}let a=db.items.filter(x=>x.name.toLowerCase().includes(q)).slice(0,40);$("results").innerHTML=a.map((x,i)=>`<div class=item><div><b>${x.name}</b><div class=meta>${num(x.value)}${x.demand?" • Demand "+x.demand:""}</div></div><button data-i="${i}">Add</button></div>`).join("")||'<div class=small>No matches.</div>';document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{let a=db.items.filter(x=>x.name.toLowerCase().includes($("search").value.toLowerCase().trim())).slice(0,40);o[side].push(a[+b.dataset.i]);render()})}
function total(a){return a.reduce((s,x)=>s+Number(x.value||0),0)}
function renderOffer(id,a){$(id).innerHTML=a.map((x,i)=>`<div class=offerline><div><b>${x.name}</b><div class=meta>${num(x.value)}</div></div><button data-d="${i}">×</button></div>`).join("")||'<div class=small>No items</div>';$(id).querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{a.splice(+b.dataset.d,1);render()})}
function render(){renderOffer("you",o.you);renderOffer("them",o.them);let a=total(o.you),b=total(o.them),d=b-a;$("yt").textContent="Total: "+num(a);$("tt").textContent="Total: "+num(b);let r=$("result");r.className="wfl "+(!a||!b?"":Math.abs(d)<=Math.max(a,b)*.05?"":" "+(d>0?"bad":"good"));r.textContent=!a||!b?"Add items":Math.abs(d)<=Math.max(a,b)*.05?"FAIR":d>0?"LOSS":"WIN";$("details").textContent=a&&b?"Difference: "+(d>0?"+":"")+num(d):""}
$("side").onclick=()=>{side=side==="you"?"them":"you";$("side").textContent="Adding to: "+(side==="you"?"YOU":"THEM")};$("search").oninput=renderResults;$("refresh").onclick=()=>load(true);$("clear").onclick=()=>{o={you:[],them:[]};render()};$("copy").onclick=()=>navigator.clipboard?.writeText(`MM2 Trade\nYou: ${o.you.map(x=>x.name).join(", ")} = ${total(o.you)}\nThem: ${o.them.map(x=>x.name).join(", ")} = ${total(o.them)}\nResult: ${$("result").textContent}`);load();
</script></body></html>
