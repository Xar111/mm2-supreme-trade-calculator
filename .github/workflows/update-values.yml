name: Update Supreme Values

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-supreme-values
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Download Supreme Values
        run: python scripts/update_values.py

      - name: Save updated values
        run: |
          git config user.name "MM2 Supreme Values Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/values.json
          git diff --cached --quiet || git commit -m "Update Supreme Values"
          git pull --rebase origin main
          git push origin HEAD:main
