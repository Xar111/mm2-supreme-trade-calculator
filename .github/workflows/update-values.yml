name: Update Supreme Values

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: update-supreme-values
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Download Supreme Values
        run: python scripts/update_values.py

      - name: Save updated values
        run: |
          git config user.name "MM2 Supreme Values Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset --mixed origin/main

          git add data/values.json

          if git diff --cached --quiet; then
            echo "No value changes to save."
            exit 0
          fi

          git commit -m "Update Supreme Values"

          git pull --rebase origin main
          git push origin HEAD:main
