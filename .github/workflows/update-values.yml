name: Update Supreme Values

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: update-supreme-values
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Download Supreme Values
        run: python scripts/update_values.py

      - name: Save updated values
        run: |
          git config user.name "MM2 Supreme Values Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Update attempt $attempt"

            git fetch origin main
            git reset --mixed origin/main
            git add data/values.json

            if git diff --cached --quiet; then
              echo "Values are already up to date."
              exit 0
            fi

            git commit -m "Update Supreme Values"

            if git push origin HEAD:main; then
              echo "Values updated successfully."
              exit 0
            fi

            echo "Push failed; retrying with the latest repository."
          done

          echo "Failed after 5 attempts."
          exit 1
